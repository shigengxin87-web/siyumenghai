button,select{font:inherit}.shell{max-width:1480px;margin:auto;padding:24px}.hero{position:relative;overflow:hidden;border-radius:26px;padding:32px;background:linear-gradient(135deg,#073f30,#079668 58%,#43d4a4);color:#fff;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;width:360px;height:360px;border:70px solid rgba(255,255,255,.1);border-radius:50%;right:-80px;top:-170px}.brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1}.logo{display:grid;place-items:center;width:54px;height:54px;border-radius:17px;background:#fff;color:var(--green);font-size:25px;font-weight:900}.brand h1{font-size:30px;margin:0}.brand p{margin:5px 0 0;color:rgba(255,255,255,.8)}

: "英语韩老师【工作微信】", "session_no": 1, "content": "有道理👍"}, {"date": "2026-07-02", "time": "15:41", "nickname": "石更新（群主）", "session_no": 1, "content": "[链接/文件]"}, {"date": "2026-07-02", "time": "15:41", "nickname": "石更新（群主）", "session_no": 1, "content": "刚在一个群里看到大家在讨论关于【视频号直播间挂二维码导流】的问题，正常来说这个动作是违规的，但是有人发现很多直播间都在这么做，感觉到很奇怪。 就这个问题我跟你们分享一下，暂时用不到也可以了解下避免以后踩坑。 1 直播间挂二维码这个事情是官方发过文档说过的违规动作 2 官方也说过账号主页不让挂微信号，但是也有大量人在挂 3 官方说的很多规则其实都是概率性的规则，不是一刀切的，比如不让你直播间挂二维码，除非是就不给挂图片的功能（但是这个不可能的） 4 既然是概率事件，所以就没有规律可言。所以有人就违规有人就不违规 5 大批量在直播间挂二维码这个动作主要有两个节点，第一个是23 24年那会，因为那会不严格不查这些，另一个就是今年的上半年，在平台发布规定后大部分人其实并不知道有违规的规定规则， 无知无畏，所以当别人看到同行在挂的时候他也就会去挂，这么相互借鉴就越来越多了。 6 如果你的业务和流量情况必须要挂二维码，那么这里有一个核心点要注意，【在你口播引导大家截图去微信扫码领取xxx资料xxx课程的时候】再挂上来，因为一直挂着就会增加平台检索到的概率，以及会有人截图下来投诉你。 不引导的时候挂着效率非常低，大部分类目和大部分人群都不会主动去截图扫码找你的，除非同行和竞品才会那么积极。 如果一场直播不挂车，就是做导流用的，可以增加导流的频次，设计好话术和钩子，在短时间展示的时候让对方感受到想要你的东西，从而听你的话去截图去扫码去加你。"}, {"date": "2026-07-02", "time": "15:45", "nickname": "石更新（群主）", "session_no": 1, "content": "在做这个社群之前，我有一个确定要做的事情就是出一门小课——三大平台私域导流策略。 因为我从22年开始做抖音视频号小红书这些，关于导流的动作、技巧、工具、策略、风险我都非常的清楚，帮助过不少于100人解决过相关问题。 之前我有写过一个文档但不算课程，有一次在一个群帮了几个人后我问他们说需要一门课嘛，他们说非常需要，所以我决定做一下，计划定价是99. 等过几天我把这些做好后，到时候给你们，算作社群的权益就不用单独买了。"}, {"date": "2026-07-02", "time": "15:53", "nickname": "石更新（群主）", "session_no": 1, "content": "[文件] 20260702155133_rec_.mp4"}, {"date": "2026-07-02", "time": "15:54", "nickname": "石更新（群主）", "session_no": 1, "content": "录了个屏，给你们先预览下[呲牙]等过两天把三大平台的都完善好分享给你们"}, {"date": "2026-07-02", "time": "15:56", "nickname": "石更新（群主）", "session_no": 1, "content": "不出意外，整个全网不会有我搞得最全最细最便宜最具体最结果"}, {"date": "2026-07-02", "time": "15:57", "nickname": "石更新（群主）", "session_no": 1, "content": "之前有个朋友跟我说，真的只要99？她根本不相信！[偷笑]"}, {"date": "2026-07-02", "time": "15:58", "nickname": "石更新（群主）", "session_no": 1, "content": "哈哈，到时候给你感受下 ↳ 回复: 哇，太期待了[社会社会][666]"}, {"date": "2026-07-02", "time": "16:01", "nickname": "石更新（群主）", "session_no": 1, "content": "[图片]"}, {"date": "2026-07-02", "time": "16:01", "nickname": "石更新（群主）", "session_no": 1, "conte 影响精彩程度。 那反击打得非常好，过人和传射都很漂亮，太牛了。 于是我发了个朋友圈，说：“埃及太牛逼了。” 发完我就继续去看世界杯了。看完比赛回来，朋友圈里已经因为比赛结束炸开了锅——阿根廷 3 比 2 逆转了。 我朋友圈里有好几个人在下面问：“现在呢？现在呢？”意思就是现在还牛逼不牛逼。起初我倒没什么感觉，不觉得他们态度不好（当然有可能真的只是无意评论）。但后面陆续又有一些人评论：“现在还牛逼不牛逼？”“现在不牛逼了吧？”“说早了吧？” 其实我单纯只是想夸一下埃及那两个球踢得牛逼，但后面越来越多的评论，让我感觉到他们好像并不是很友好，带着一种不太好的态度。我觉得有点不舒服，我就解释了一下。我说：“我说埃及牛逼，只是在夸埃及，并不代表阿根廷不牛逼，我只是想夸一下埃及而已。” 后来有一个朋友在朋友圈评论我，说他的朋友圈也是这样两极分化，我们就聊了聊这个事。 其实这事并没有长影响到我的心情。我当时的第一反应反而是：这可以成为我的一个视频选题！ 我马上起床，直接开拍，把这段故事拍成了视频。这条视频的流量，确确实实比我前面发的那些专业相关的内容要好得多。 我发这条视频，其实也是想实践和验证几个事： 1. 执行力：想干就干，说干就干。 2. 不用在意别人的眼光：它既然是一个可以探讨的选题，大胆放心去说就可以了。 3. 蹭热点，自己从当事人的角度感受一下评论，从结果来看，确实跑得很快。不过目前的数据（点赞、评论）基本上都是发了视频一小时左右跑出来的，后来就不怎么涨了。 我也看了一些评论，觉得还蛮有意思的，各种角度…"}, {"date": "2026-07-08", "time": "20:32", "nickname": "石更新（群主）", "session_no": 2, "content": "@一月语文 选关注 500微信豆 自定义 年龄选你对应人群的年龄。 兴趣选：知识，去选符合的。 性别选女（你面对的更多都是女家长）。 人群选相似达人，找几个符合你目标人群的达人，不要选大博主，选比你大一些的就行。 地区不选 设备不选 24小时跑 先跑跑看，如果没跑完就可以再建计划，稍微放宽点范围"}, {"date": "2026-07-08", "time": "22:39", "nickname": "石更新（群主）", "session_no": 3, "content": "[链接] 一个999元的付费社群，运营7天，我到底交付了什么？"}, {"date": "2026-07-08", "time": "22:40", "nickname": "石更新（群主）", "session_no": 3, "content": "原本计划今天给大家分享一下，我是怎么把我平时关注的公众号一键同步到飞书多维表格以及 Obsidian 的。 但是我觉得这个分享的密度可以稍微再控一下，所以我决定把它放在明天。（更欢迎大家提需） 今天我写了一篇算是这个社群 7 天的回忆录，也算是一个汇报。 同时也希望后面我们可以主要有以下两种类型的内容： 1. 一方面是优质内容+有参考性的咨询解析 2. 另一方面是个性化的交互性的答疑"}, {"date": "2026-07-08", "time": "23:04", "nickname": "石更新（群主）", "session_no": 3, "content": "@付展鹏 欢迎付总，十多年跨行业经验，涉及新媒体，餐饮，石化，跨境，AI多个领域，这个经历和能力太牛了，我很羡慕哈哈😄"}, {"date": "2026-07-08", "time": "23:14", "nickname": "石更新（群主）", "session_no": 3, "content": "ai时代降维打击，后面有机会也可以分享分享[啤酒]"}, {"date": "2026-07-08", "time": "23:14", "nickname": "石更新（群主）", "session_no": 3, "content": "一起越来越好"}, {"date": "2026-07-08", "time": "23:34", "nickname": "石更新（群主）", "session_no": 3, "content": "还是大号吗 还是小号啊"}, {"date": "2026-07-08", "time": "23:38", "nickname": "石更新（群主）", "session_no": 3, "content": "你是单抖音吧 视频号是不是没开过。 禁的明天可以用视频号联络联络"}, {"date": "2026-07-08", "time": "23:52", "nickname": "石更新（群主）" 8:33", "nickname": "石更新（群主）", "session_no": 1, "content": "[链接/文件] 我拍了拍 \"溪子\""}, {"date": "2026-07-19", "time": "19:05", "nickname": "石更新（群主）", "session_no": 2, "content": "我的 Typeless 被我用到极致了 现在有任何一个话题选题，我想说的，直接快速地口喷出来，然后把口喷的文字放在我的飞书文档里面，把这个链接扔给我的飞书助理，让它给我做一下优化排版，我这个 1.0 的内容就算完成了。(直接把文字发给飞书龙虾助理，让它优化后直接创建文档放进去会更快一点点) 然后我再把飞书链接扔给 Codex，跟它说：“你帮我按照‘摸鱼绿’的风格排版，推送到草稿箱。”它就会帮我进行二次优化，并采用富文本方式排版，直接推送到公众号草稿箱。这样我的排版风格和设计什么的都不会丢。 最后我去公众号后台检查一下，花 3 分钟稍微设置一下推送发布，就完成了。 整个流程下来，其实撑死也就 15 到 20 分钟（快的话 15 分钟，慢一点也就 20 分钟）： 1. 口喷：5 到 8 分钟（因为语音速度比较快） 2. 飞书文档微调及存档：2 分钟 3. Codex 排版和推送：5分钟 4. 公众号后台设置：3 分钟 全程从选题出来到最后发布，真的非常快。"}, {"date": "2026-07-19", "time": "19:07", "nickname": "石更新（群主）", "session_no": 2, "content": "[链接/卡片]"}, {"date": "2026-07-19", "time": "19:28", "nickname": "石更新（群主）", "session_no": 2, "content": "可以说一说你遇到的一些问题，或者你想优化的一些链路，然后一起帮你看看有没有可以提升的办法[机智]"}, {"date": "2026-07-19", "time": "19:28", "nickname": "石更新（群主）", "session_no": 2, "content": "人多力量大"}, {"date": "2026-07-19", "time": "19:32", "nickname": "石更新（群主）", "session_no": 2, "content": "我在咱们社群官网的左下角插入了一个可以下载视频号原视频的工具，不知道有没有朋友发现这个功能[呲牙]"}, {"date": "2026-07-19", "time": "19:33", "nickname": "石更新（群主）", "session_no": 2, "content": "快去体验试试吧"}, {"date": "2026-07-19", "time": "20:35", "nickname": "石更新（群主）", "session_no": 3, "content": "[链接] 志同道合，才能有更多火花💥"}, {"date": "2026-07-19", "time": "20:35", "nickname": "石更新（群主）", "session_no": 3, "content": "升级为石董会后的第一次线下会晤[胜利]"}, {"date": "2026-07-19", "time": "20:36", "nickname": "石更新（群主）", "session_no": 3, "content": "[链接/文件] 我拍了拍 \"张聪（IP线下课变现操盘）\" IP线下课变现专家[庆祝]"}, {"date": "2026-07-19", "time": "18:31", "nickname": "溪子", "session_no": 1, "content": "很荣幸认识大家"}, {"date": "2026-07-19", "time": "18:48", "nickname": "溪子", "session_no": 1, "content": "🌟昵称：溪子 base杭州 -🌟 自我介绍： 1 美国临床心理咨询艺术治疗双硕士 /十四年心理咨询师/七年北师大研究生督导 2心理博主 小红书6.2万 粉丝全平台50万 🌟 我可以提供什么： 知识IP 小红书获客"}, {"date": "2026-07-19", "time": "18:49", "nickname": "溪子", "session_no": 1, "content": "[链接] @溪子的个人主页"}, {"date": "2026-07-19", "ti 板”才能拿到结果。 像平时那样好声好气地跟它沟通，甚至去“理解”它，是万万不可行的，因为它根本无法理解人类的语气和情绪。 刚刚发生的一件事，让我更加深了这个观点： 我帮同组的一位同学去网站上爬取差评。本来为了省点额度，我不想用 Codex，打算用“龙虾”来爬。结果试了五六次都没爬下来。因为已经答应了人家，我只能硬着头皮不断尝试。就在我准备放弃的那一刻，我不小心把原来的指令又发了一次。出乎意料的是，这一次它居然直接把结果返回给我了，中间甚至没有让我进行任何登录、手机号验证或扫码。 所以，当我们接下来面对 AI、面对 Agent 时，一定要转变心态：要把 AI 当成主力，是我们来协助 AI，而不是 AI 来协助我们。 AI Native 的时代已经来了。"}, {"date": "2026-07-25", "time": "23:56", "nickname": "石更新（群主）", "session_no": 3, "content": "对，用codex做的 ↳ 回复: 是 codex 做的？"}, {"date": "2026-07-25", "time": "23:57", "nickname": "石更新（群主）", "session_no": 3, "content": "[链接/卡片]"}, {"date": "2026-07-25", "time": "23:57", "nickname": "石更新（群主）", "session_no": 3, "content": "[链接/文件] 群聊的聊天记录"}, {"date": "2026-07-25", "time": "23:58", "nickname": "石更新（群主）", "session_no": 3, "content": "[链接/卡片]"}, {"date": "2026-07-25", "time": "23:58", "nickname": "石更新（群主）", "session_no": 3, "content": "么么哒"}, {"date": "2026-07-25", "time": "23:59", "nickname": "石更新（群主）", "session_no": 3, "content": "你这么说 我就开心了"}, {"date": "2026-07-25", "time": "09:43", "nickname": "录播服务商姚魁", "session_no": 1, "content": "感谢更新~[抱拳]"}, {"date": "2026-07-25", "time": "12:15", "nickname": "Allen@群响", "session_no": 1, "content": "我是胡老师粉丝"}, {"date": "2026-07-25", "time": "12:16", "nickname": "胡天真", "session_no": 1, "content": "[链接/文件] 微信红包"}, {"date": "2026-07-25", "time": "12:16", "nickname": "胡天真", "session_no": 1, "content": "我也是你的粉丝哈哈哈 ↳ 回复 Allen@群响: 我是胡老师粉丝"}, {"date": "2026-07-25", "time": "12:17", "nickname": "胡天真", "session_no": 1, "content": "我也是你粉丝哈哈哈[旺柴] ↳ 回复 Joey乔伊: 我是胡老师粉丝"}, {"date": "2026-07-25", "time": "12:17", "nickname": "胡天真", "session_no": 1, "content": "很高兴认识大家，多交流[爱心]"}, {"date": "2026-07-25", "time": "12:20", "nickname": "胡天真", "session_no": 1, "content": "我继续努力[旺柴]"}, {"date": "2026-07-25", "time": "12:16", "nickname": "Joey乔伊", "session_no": 1, "content": "我是胡老师粉丝"}, {"date": "2026-07-25", "time": "23:54", "nickname": "Joey乔伊", "session_no": 2, "content": "@石更新(咨询陪跑内训) 这个视觉 vi 挺好看的"}, {"date": "2026-07-25", "tim function drawTrend(){
  const rows=DATA.dailySummary,w=920,h=310,l=40,r=30,t=20,b=42,iw=w-l-r,ih=h-t-b;
  const maxM=Math.max(...rows.map(x=>x.message_count),1),maxS=Math.max(...rows.map(x=>x.activity_sessions),1),step=iw/rows.length,bw=Math.max(8,step*.55);
  let out="";
  for(let i=0;i<=4;i++){const y=t+ih*i/4;out+=`<line class="grid-line" x1="${l}" y1="${y}" x2="${w-r}" y2="${y}"/><text class="axis-label" x="${l-8}" y="${y+4}" text-anchor="end">${Math.round(maxM*(4-i)/4)}</text>`}
  const pts=[];
  rows.forEach((d,i)=>{const x=l+step*i+step/2,bh=ih*d.message_count/maxM,y=t+ih-bh,sy=t+ih-ih*d.activity_sessions/maxS;out+=`<rect class="message-bar" x="${x-bw/2}" y="${y}" width="${bw}" height="${bh}" rx="4"><title>${d.date_label}：${d.message_count}条消息</title></rect>`;pts.push(`${x},${sy}`);if(i%3===0||i===rows.length-1)out+=`<text class="axis-label" x="${x}" y="${h-15}" text-anchor="middle">${d.date.slice(5).replace("-","/")}</text>`});
  out+=`<polyline class="session-line" points="${pts.join(" ")}"/>`;
  rows.forEach((d,i)=>{const x=l+step*i+step/2,sy=t+ih-ih*d.activity_sessions/maxS;out+=`<circle class="session-dot" cx="${x}" cy="${sy}" r="3.5"><title>${d.date_label}：${d.activity_sessions}次活跃</title></circle>`});
  document.getElementById("trend").innerHTML=out;
}

}
const dates=DATA.dailySummary.map(x=>x.date),select=document.getElementById("dateSelect");

function renderDay(date){
  const sum=DATA.dailySummary.find(x=>x.date===date),ranks=DATA.dailyRankings.filter(x=>x.date===date),details=DATA.messageDetails.filter(x=>x.date===date);
  document.getElementById("dayTitle").textContent=`${+date.slice(5,7)} 月 ${+date.slice(8)} 日活跃排行榜`;

  const list=document.getElementById("rankingList");

  }).join("");
}
