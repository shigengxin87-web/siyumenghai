<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="把视频号本地助手安装地址和提示词交给 Agent。">
  <title>本地助手安装与使用</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #172033; background: #f3faf6; }
    main { width: min(720px, calc(100% - 32px)); margin: 48px auto; padding: 30px; background: #fff; border: 1px solid #d8eee3; border-radius: 22px; box-shadow: 0 18px 45px rgba(9, 99, 70, .08); }
    h1 { margin: 0 0 12px; font-size: 28px; }
    .lead { margin: 0 0 24px; color: #667085; line-height: 1.8; }
    .block { margin-top: 18px; padding: 18px; color: #475467; background: #f8fbf9; border: 1px solid #e4f1ea; border-radius: 14px; }
    .block strong { display: block; margin-bottom: 10px; color: #172033; }
    code { display: block; overflow-wrap: anywhere; padding: 12px; color: #067653; background: #eaf8f1; border-radius: 9px; line-height: 1.6; }
    textarea { width: 100%; min-height: 150px; padding: 14px; color: #344054; background: #fff; border: 1px solid #cfe6da; border-radius: 10px; resize: vertical; font: inherit; line-height: 1.7; }
    button { margin-top: 14px; padding: 13px 20px; color: #fff; background: #079669; border: 0; border-radius: 12px; font: inherit; font-weight: 750; cursor: pointer; }
    button:active { transform: translateY(1px); }
    .status { margin: 10px 0 0; min-height: 22px; color: #079669; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>本地助手安装与使用</h1>
    <p class="lead">复制下面的提示词发送给你的 Agent，它会根据安装地址自主下载、安装，并指导你使用。</p>
    <section class="block">
      <strong>安装地址</strong>
      <code>https://github.com/ltaoo/wx_channels_download/releases/latest</code>
    </section>
    <section class="block">
      <strong>发给 Agent 的提示词</strong>
      <textarea id="agent-prompt" readonly>请使用下面的安装地址，下载与我电脑系统匹配的“视频号本地助手”，完成安装并启动服务，然后指导我在微信电脑版打开视频号页面，并回到视频下载工具提取和复制评论。

安装地址：https://github.com/ltaoo/wx_channels_download/releases/latest</textarea>
      <button type="button" id="copy-prompt">复制提示词</button>
      <p class="status" id="copy-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const button = document.querySelector('#copy-prompt');
    const prompt = document.querySelector('#agent-prompt');
    const status = document.querySelector('#copy-status');
    button.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(prompt.value);
      } catch {
        prompt.select();
        document.execCommand('copy');
      }
      button.textContent = '已复制';
      status.textContent = '提示词已复制，直接粘贴发送给你的 Agent 即可。';
    });
  </script>
</body>
</html>
