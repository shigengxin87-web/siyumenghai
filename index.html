<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#f7f7f5">
  <title>网站升级中</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f7f7f5;
      color: #242421;
    }
    main {
      width: min(520px, calc(100% - 40px));
      padding: 48px 40px;
      border: 1px solid #e3e2dc;
      border-radius: 24px;
      background: #fff;
      text-align: center;
      box-shadow: 0 20px 60px rgba(33, 33, 28, 0.06);
    }
    .mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #252521;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 20px;
      letter-spacing: 0.04em;
    }
    h1 { margin: 0; font-size: clamp(28px, 7vw, 40px); letter-spacing: -0.03em; }
    p { margin: 18px 0 0; color: #74736c; font-size: 16px; line-height: 1.8; }
    small { display: block; margin-top: 28px; color: #aaa8a0; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">石</div>
    <h1>网站升级中</h1>
    <p>这里正在为下一阶段做准备。<br>正式开放时，再和你见面。</p>
    <small>siyumenghai.cn</small>
  </main>
</body>
</html>
