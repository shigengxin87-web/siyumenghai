location ^~ /api/transcripts-test-tencent/ {
    # Keep transcript jobs isolated from /api/transcripts/media Range traffic.
    # Video playback can issue many small requests and must never consume the
    # request budget used to submit or poll a transcript job.
    limit_req zone=transcripts_cloud_jobs burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:2032/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
