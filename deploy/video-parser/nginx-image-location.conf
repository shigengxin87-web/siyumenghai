# Include in the same server as nginx-location.conf.
location = /api/transcripts/images {
    limit_req zone=video_image_api burst=80 nodelay;
    proxy_pass http://127.0.0.1:2026/images;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
