# Formal cloud C transcript route. The test alias remains available so the
# comparison page and production page can be validated independently.
location ^~ /api/transcripts-cloud/ {
    limit_req zone=transcripts_cloud_jobs burst=30 nodelay;
    limit_req_status 429;
    error_page 429 = @transcripts_cloud_rate_limited;
    error_page 502 503 504 = @transcripts_cloud_unavailable;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:2031/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
}

location ^~ /api/transcripts-test-cloud/ {
    limit_req zone=transcripts_api burst=15 nodelay;
    limit_req_status 429;
    error_page 429 = @transcripts_cloud_rate_limited;
    error_page 502 503 504 = @transcripts_cloud_unavailable;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:2031/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
}

location @transcripts_cloud_rate_limited {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 429 '{"error":"请求过于频繁，请稍后再试。","code":"rate_limited"}';
}

location @transcripts_cloud_unavailable {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"云端逐字稿服务暂时不可用，请稍后重试。","code":"service_unavailable"}';
}
