# Formal cloud C transcript route. The test alias remains available so the
# comparison page and production page can be validated independently.
location ^~ /api/transcripts-cloud/ {
    limit_req zone=transcripts_api burst=15 nodelay;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:2031/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
}

location ^~ /api/transcripts-test-cloud/ {
    limit_req zone=transcripts_api burst=15 nodelay;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:2031/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store" always;
}
