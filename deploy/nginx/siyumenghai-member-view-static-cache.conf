# Versioned video-tool assets are safe to reuse between page visits. The HTML
# remains no-cache so it can point browsers at a new query-string version after
# every deployment.
location ~* ^/member-view/(video-downloader-app(?:-v[0-9]+)?\.js|video-batch\.js|assets/vendor/[^/]+\.js)$ {
    add_header Cache-Control "public, max-age=604800, immutable" always;
    try_files $uri =404;
}
